name: Cypress Checkout

on:
  push:
    paths:
      - ".github/workflows/cypress-checkout.yml"
      - "cypress/**"
      - "cypress.config.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/cypress-checkout.yml"
      - "cypress/**"
      - "cypress.config.js"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checkout E2E tests
        run: npx cypress run --spec "cypress/e2e/checkout/place-order.cy.js"

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: cypress/reports
          if-no-files-found: warn
